<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">

        <button class="btn primary sm topbar-new" data-action="nueva-ruta" title="Nueva ruta">

        </button>
        <button class="icon-btn" data-action="toggle-theme" aria-label="Cambiar modo claro u oscuro" title="Modo claro / oscuro">

    </header>
